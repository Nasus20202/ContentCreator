# Self-hosted Postiz for ContentCreator.
# Based on https://github.com/gitroomhq/postiz-docker-compose (official), with:
#   - all secrets and URLs read from infra/postiz/.env (gitignored; create with `npm run postiz:init`)
#   - pinned image tags (Renovate keeps them current)
#   - ports bound to 127.0.0.1 by default — put a reverse proxy with TLS in front for OAuth callbacks
# Operate with the package scripts: postiz:init | postiz:up | postiz:down | postiz:status | postiz:logs
name: contentcreator-postiz

x-restart: &restart
  restart: unless-stopped

services:
  postiz:
    <<: *restart
    image: ghcr.io/gitroomhq/postiz-app:v2.25.3
    container_name: postiz
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTIZ_DB_USER}:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/${POSTIZ_DB_NAME}
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      RUN_CRON: 'true'
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: 'false'
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - '${POSTIZ_BIND:-127.0.0.1}:${POSTIZ_PORT:-4007}:5000'
    networks: [postiz, temporal]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const r=require('http').get('http://localhost:5000/api/public/v1/integrations',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postiz-postgres: { condition: service_healthy }
      postiz-redis: { condition: service_healthy }
      temporal: { condition: service_healthy }

  postiz-postgres:
    <<: *restart
    image: postgres:17.11-alpine
    container_name: postiz-postgres
    environment:
      POSTGRES_USER: ${POSTIZ_DB_USER}
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD}
      POSTGRES_DB: ${POSTIZ_DB_NAME}
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    networks: [postiz]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTIZ_DB_USER} -d ${POSTIZ_DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  postiz-redis:
    <<: *restart
    image: redis:8.10.3-alpine
    container_name: postiz-redis
    volumes:
      - postiz-redis-data:/data
    networks: [postiz]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- Temporal (Postiz workflow engine)
  # Versions follow what upstream postiz-docker-compose tests against; bump together with Postiz.
  temporal-elasticsearch:
    <<: *restart
    image: elasticsearch:7.17.27
    container_name: temporal-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    networks: [temporal]
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  temporal-postgresql:
    <<: *restart
    image: postgres:16.15-alpine
    container_name: temporal-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks: [temporal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    <<: *restart
    image: temporalio/auto-setup:1.28.1
    container_name: temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks: [temporal]
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', 'temporal:7233']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      temporal-postgresql: { condition: service_healthy }
      temporal-elasticsearch: { condition: service_healthy }

  # Optional UI for debugging workflows: docker compose --profile debug up -d
  temporal-ui:
    <<: *restart
    profiles: [debug]
    image: temporalio/ui:2.34.0
    container_name: temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - '127.0.0.1:8080:8080'
    networks: [temporal]
    depends_on:
      temporal: { condition: service_healthy }

networks:
  postiz:
  temporal:

volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres-data:
  postiz-redis-data:
  temporal-elasticsearch-data:
  temporal-postgres-data:
